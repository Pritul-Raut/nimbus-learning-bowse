<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nimbus Browser</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <div id="tabstrip">
    <div id="tabs"></div>
    <button id="newtab-btn" class="ib" title="New tab (Alt+T)">+</button>
  </div>

  <div id="toolbar">
    <button id="back" class="ib" title="Back (Alt+←)"><svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></button>
    <button id="fwd" class="ib" title="Forward (Alt+→)"><svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg></button>
    <button id="reload" class="ib" title="Reload (Alt+R)"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg></button>
    <button id="home-btn" class="ib" title="Home"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg></button>

    <form id="omni" autocomplete="off">
      <svg class="lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
      <input id="url" spellcheck="false" placeholder="Search or enter address (Ctrl+L)">
      <button type="button" id="star" class="ib sm" title="Bookmark this page"><svg viewBox="0 0 24 24"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.5 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg></button>
    </form>

    <button id="menu" class="ib" title="History, bookmarks, settings"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></button>
  </div>

  <div id="bookmarks"></div>
  <div id="progress"></div>

  <main id="viewport">
    <section id="home">
      <div class="home-inner">
        <div class="logo">Nimbus</div>
        <div id="greeting"></div>
        <form id="home-form" autocomplete="off">
          <input id="home-q" placeholder="Search or enter address" spellcheck="false">
        </form>
        <div id="tiles"></div>
      </div>
    </section>
  </main>

  <aside id="drawer" hidden>
    <header>
      <nav>
        <button data-view="history">History</button>
        <button data-view="bookmarks">Bookmarks</button>
        <button data-view="settings">Settings</button>
      </nav>
      <button id="drawer-close" class="ib" title="Close">×</button>
    </header>
    <div id="drawer-body"></div>
  </aside>

  <div id="toast"></div>
</div>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
